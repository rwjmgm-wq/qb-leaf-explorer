name: Weekly LEAF v3 Rating Update

on:
  schedule:
    - cron: '0 11 * * 2'   # Tuesdays 11:00 UTC (after MNF, before the next slate)
  workflow_dispatch:        # manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  update-ratings:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # nfl_data_py 0.3.3 pins pandas<2, so CI resolves to pandas 1.5.3 while
      # local dev runs 2.x. Pinned here so the engine is exercised against a
      # known pair; engine code avoids pandas-2-only APIs either way.
      - name: Install dependencies
        run: pip install "pandas==1.5.3" "numpy==1.26.4" "nfl_data_py==0.3.3" pyarrow

      - name: Verify engine reproduces frozen parameters
        run: python pipeline/verify_engine.py

      - name: Rebuild ratings (fetch pbp -> LEAF v3 engine -> app exports)
        run: python pipeline/update_all.py

      - name: Commit refreshed ratings
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "LEAF v3 Weekly Update"
          # -A (not a glob) for two reasons: it stages the DELETIONS of the
          # superseded dated exports that update_all.py prunes, and it skips
          # gitignored paths silently instead of exiting 1 on them
          # (data/production/leaf_v3_ratings.csv is the ignored intermediate).
          git add -A data/production data/raw/player_meta.csv
          git status --short
          git diff --staged --quiet || git commit -m "Weekly LEAF v3 rating update [$(date +'%Y-%m-%d')]"
          git push
